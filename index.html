<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sbai</title>
<style>
:root{
  --bg:#000000; --card:#0f0f0f; --line:#2c2c2c; --tile:#1a1a1a; --accent:#f0c56a;
  --text:#ffffff; --muted:#a8a8a8; --btn1:#ffd88a; --btn2:#e8a94a; --btn-text:#111111;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000000}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:48px 18px;
  background:radial-gradient(ellipse at 50% 0%,#222222 0%,#0b0b0b 40%,var(--bg) 100%);
  color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:440px;background:linear-gradient(180deg,#141414,#080808);
  border:1.5px solid var(--line);border-radius:44px;padding:44px 28px 30px;text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.35)}
.logo{width:110px;height:110px;margin:0 auto 22px;border-radius:50%;background:rgba(240,197,106,.2);
  display:grid;place-items:center}
.logo span{width:92px;height:92px;border-radius:50%;border:2px solid var(--accent);
  background:radial-gradient(circle at 40% 25%,#2e2e2e,#0d0d0d);display:grid;place-items:center;
  font:700 40px Georgia,"Times New Roman",serif;color:var(--accent)}
.logo span{overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
h1{margin:0;font:700 56px Georgia,"Times New Roman",serif;letter-spacing:.14em;padding-left:.14em}
.sub{margin:14px 0 36px;color:var(--muted);font-size:19px}
.links{display:flex;flex-direction:column;gap:14px}
.link{display:flex;align-items:center;gap:16px;padding:14px 18px;border:1.5px solid var(--line);
  border-radius:28px;background:rgba(255,255,255,.02);color:inherit;text-decoration:none;text-align:left}
.link:focus-visible,.save:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--tile);display:grid;place-items:center}
.ic svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:19px;font-weight:600}
.txt small{display:block;margin-top:3px;font-size:17px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.chev{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.save{margin-top:20px;width:100%;display:flex;justify-content:center;align-items:center;gap:14px;
  padding:22px;border:0;border-radius:28px;background:linear-gradient(180deg,var(--btn1),var(--btn2));
  color:var(--btn-text);font:600 21px Inter,system-ui,sans-serif;cursor:pointer}
.save svg{width:24px;height:24px;stroke:var(--btn-text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
footer{margin-top:30px;color:var(--muted);font-size:16px}
@media (max-width:380px){h1{font-size:44px}.txt small{font-size:15px}}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><span>SB</span></div>
  <h1>Sbai</h1>
  <p class="sub">Connect with us</p>

  <nav class="links">
    <a class="link" href="https://www.instagram.com/adam_sbaiii" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg></span>
      <span class="txt"><b>Instagram</b><small>@adam_sbaiii</small></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </a>
    <a class="link" href="https://www.tiktok.com/@adam_sbai85" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M14 3v11.5a3.500 3.500 0 1 1-3.500-3.500M14 3c.3 2.500 2 4.200 4.500 4.500"/></svg></span>
      <span class="txt"><b>TikTok</b><small>@adam_sbai85</small></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </a>
    <a class="link" href="https://wa.me/212616797799" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.400-2.400-2.400l.8-1-1-2z"/></svg></span>
      <span class="txt"><b>WhatsApp</b><small>Send us a message</small></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </a>
    <a class="link" href="tel:+212616797799">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></span>
      <span class="txt"><b>Call</b><small>0616 797 799</small></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </a>
  </nav>

  <button class="save" id="save" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
    Save contact
  </button>
  <footer>© 2026 Sbai</footer>
</main>
<script>
document.getElementById('save').addEventListener('click',function(){
  var vcf='BEGIN:VCARD\nVERSION:3.0\nFN:Sbai\nORG:Sbai\nTEL;TYPE=CELL:+212616797799\nURL:https://www.instagram.com/adam_sbaiii\nEND:VCARD';
  try{
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([vcf],{type:'text/vcard'}));
    a.download='Sbai.vcf';document.body.appendChild(a);a.click();a.remove();
  }catch(e){}
});
</script>
</body>
</html>
